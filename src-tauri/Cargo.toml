[package]
name = "career-ai-leadership-elite"
version = "1.0.0"
description = "Career AI Leadership Elite desktop base (Rust/Tauri + system WebView) with signed GitHub auto-updates and an Elixir sidecar slot, by A Elite Estrangeira."
edition = "2021"

[lib]
name = "career_ai_leadership_elite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
lto = true
codegen-units = 1
